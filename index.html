<style>
/* Layout: one-column wizard — step rail on top, sticky tally, one working area per step, fixed bottom action bar */
:root{
  /* light beige base; buttons and frames outlined in brown; white inside with black text */
  --bg:#f7f2eb; --surface:#ffffff; --sunk:#fbf8f4; --ink:#1d1a1c; --muted:#76695f; --line:#e5d9cc;
  --brown:#8a6a55; --brown-soft:#d8c6b5; --beige:#f1e7dc;
  --accent:#8a6a55; --accent-ink:#ffffff; --hi:#eadbc9; --hi-ink:#1d1a1c; --ok:#4c8a6e; --warn:#a46f27; --bad:#c43f4e;
  --rose:#c9ab93; --blush:#f4ebe1; --sand:#efe4d6;
  --chk1:#ffffff; --chk2:#ece6df; --talk:#a9b9c9;
  --f-display:"Zen Maru Gothic","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);background-image:radial-gradient(900px 520px at 0% -8%,var(--blush) 0%,transparent 62%),radial-gradient(800px 480px at 105% 0%,var(--sand) 0%,transparent 58%);background-repeat:no-repeat;min-height:100%}
body{background:transparent}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.03em}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chk{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/14px 14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-block:20px 12px}
.top h1{font-size:26px}
.top p{margin:0;color:var(--muted);font-size:13px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.rail button i{font-style:normal;font-family:var(--f-display);font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line)}
.rail button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail button[aria-current="step"] i{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.rail button.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.rail button:disabled{opacity:.45;cursor:not-allowed}
.tally{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.tally .kind{font-size:12px;opacity:.75}
.count{display:flex;align-items:baseline;gap:5px;font-family:var(--f-display)}
.count b{font-size:30px;font-weight:400;line-height:1}
.count span{font-size:16px;opacity:.6}
.need{font-weight:700}
.need .n{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:0 8px;margin-inline:3px;font-family:var(--f-display);font-weight:400;font-size:18px}
.need.done .n{background:#8fc7ad}
.meter{flex:1 1 160px;height:9px;border-radius:99px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden;min-width:120px}

    (S.mode === 'sticker' ? `<label class="field">スタンプのサイズ<select id="fit"><option value="fixed" ${S.stickerFit === 'fixed' ? 'selected' : ''}>370×320 に統一</option><option value="tight" ${S.stickerFit === 'tight' ? 'selected' : ''}>絵に合わせて縮める</option></select></label>` : '') +
    (S.mode === 'theme' ? `<label class="field">サムネイルの背景色<input type="color" id="tbg" value="${S.themeBg}" style="width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)"></label>` : '');
  const mg = set.querySelector('#mg'); mg.oninput = e => e.target.previousElementSibling.textContent = e.target.value + 'px'; mg.onchange = e => { S.margin[S.mode] = +e.target.value; render(); };
  set.querySelector('#fit') && (set.querySelector('#fit').onchange = e => { S.stickerFit = e.target.value; render(); });
  set.querySelector('#tbg') && (set.querySelector('#tbg').onchange = e => { S.themeBg = e.target.value; render(); });
  const rv = p.querySelector('#rv'); let bad = 0, warn = 0, miss = 0;
  slotsAll().forEach(sl => {
    const cd = sourceFor(sl);
    if (!cd) { if (sl.optional) return; miss++; rv.appendChild(el(`<div class="out missing"><div><b>${esc(fname(sl))}</b>不足しています<br><span class="hint">${sl.w}×${sl.h}px</span></div></div>`)); return; }
    const r = convert(cd, sl); measure(r.canvas); const L = checks(r, sl), lv = levelOf(L); if (lv === 'bad') bad++; if (lv === 'warn') warn++;
    const card = el(`<div class="out"><div class="img"></div><footer><div class="nm"><span>${esc(fname(sl))}</span><span class="dot ${lv}"></span></div><ul>${L.map(x => `<li class="${x.lv}"><span class="dot ${x.lv}"></span>${x.t}</li>`).join('')}</ul></footer></div>`);
    const disp = mk(r.canvas.width, r.canvas.height); ctx2(disp).drawImage(r.canvas, 0, 0); disp.style.width = (r.canvas.width > 400 ? 300 : r.canvas.width) + 'px';
    card.querySelector('.img').appendChild(disp);
    const eb = el('<button class="btn sm ghost er" type="button">消しゴム</button>'); eb.onclick = () => openTouchUp(cd, 'erase');
    if (S.mode !== 'theme' && sl.idx != null) { // stickers / emoji: change the order
      card.dataset.idx = sl.idx; const n = S.count[S.mode];
      const mv = el(`<div class="mvrow"><button class="grip" type="button" aria-label="${esc(fname(sl))}をドラッグして並べ替え" title="ドラッグして並べ替え">⠿ 移動</button><button class="btn sm ghost" type="button" data-l ${sl.idx === 0 ? 'disabled' : ''} aria-label="前へ">◀</button><button class="btn sm ghost" type="button" data-r ${sl.idx >= Math.min(n, S.picked.length) - 1 ? 'disabled' : ''} aria-label="後ろへ">▶</button></div>`);
      mv.querySelector('[data-l]').onclick = () => movePick(sl.idx, sl.idx - 1);
      mv.querySelector('[data-r]').onclick = () => movePick(sl.idx, sl.idx + 1);

    }
    card.querySelector('footer').appendChild(eb);
    rv.appendChild(card);
  });
  p.querySelector('#sum').innerHTML = (miss ? `<span class="pill bad">不足 ${miss}枚</span>` : '<span class="pill ok">不足なし</span>') + (bad ? `<span class="pill bad">要修正 ${bad}</span>` : '') + (warn ? `<span class="pill warn">注意 ${warn}</span>` : '') + (sp.zipLimitMB ? `<span class="pill ok">ZIP上限 ${sp.zipLimitMB}MB</span>` : '');
}
// ---- change the order of stickers / emoji in the final list ----
function movePick(from, to) {
  const n = Math.min(S.count[S.mode], S.picked.length); if (to < 0 || to >= n || from === to) return;
  const [id] = S.picked.splice(from, 1); S.picked.splice(to, 0, id);
  toast(`${from + 1}番 → ${to + 1}番に移動しました`); render();
}
function startGrip(grip, card, list) {
  grip.addEventListener('pointerdown', ev => {
    ev.preventDefault(); grip.setPointerCapture(ev.pointerId);
    const from = +card.dataset.idx; let over = null, raf = 0, lastY = ev.clientY, moved = false; const y0 = ev.clientY;
    card.classList.add('dragging'); document.body.classList.add('sorting');
    const ghost = card.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = card.offsetWidth + 'px'; document.body.appendChild(ghost);
    const place = (x, y) => { ghost.style.left = x - card.offsetWidth / 2 + 'px'; ghost.style.top = y - 40 + 'px'; };
    place(ev.clientX, ev.clientY);
    const scroll = () => { const m = 50; if (moved && lastY < m) scrollBy(0, -12); else if (moved && lastY > innerHeight - m - 70) scrollBy(0, 12); raf = requestAnimationFrame(scroll); }; raf = requestAnimationFrame(scroll);
    const move = (e) => { lastY = e.clientY; if (Math.abs(e.clientY - y0) > 12) moved = true; place(e.clientX, e.clientY); ghost.style.visibility = 'hidden'; const t = document.elementFromPoint(e.clientX, e.clientY); ghost.style.visibility = '';
      const c = t && t.closest('.out[data-idx]'); if (over && over !== c) over.classList.remove('dropto'); over = c && c !== card ? c : null; if (over) over.classList.add('dropto'); };
    const up = () => { cancelAnimationFrame(raf); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      ghost.remove(); card.classList.remove('dragging'); document.body.classList.remove('sorting'); if (over) { over.classList.remove('dropto'); movePick(from, +over.dataset.idx); } };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}
// talk backgrounds may be any size up to the max: shrink until the PNG is 1MB or less
async function pngUnder(c, sl) {
  let b = await new Promise(res => c.toBlob(res, 'image/png'));
  if (!sl.maxSize) return b;
  let k = 1;
  while (b.size > MB && k > 0.2) { k *= 0.85; const t = mk(even(c.width * k), even(c.height * k)); drawScaled(ctx2(t), c, 0, 0, t.width, t.height); b = await new Promise(res => t.toBlob(res, 'image/png')); }
  return b;
}
async function doExport(force) {
  const miss = slotsAll().filter(s => !s.optional && !sourceFor(s)).length, cf = $('cf'), dOpen = dupState().open;
  if (dOpen && !force) { cf.innerHTML = `<div class="confirm" role="alert"><span>確認していない重複が <b>${dOpen}件</b> あります。同じイラストや同じ文言のスタンプは審査で指摘されることがあります。</span><button class="btn sm" id="dg" type="button">重複チェックに戻る</button><button class="btn sm ghost" id="dy" type="button">このまま書き出す</button></div>`;
    cf.querySelector('#dg').onclick = () => go(4); cf.querySelector('#dy').onclick = () => { cf.innerHTML = ''; doExport('dup'); }; cf.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (miss && force !== true) { cf.innerHTML = `<div class="confirm" role="alert"><span>まだ <b>${miss}枚</b> 足りません。そろっている分だけで書き出しますか？（申請にはすべて必要です）</span><button class="btn sm" id="y" type="button">このまま書き出す</button><button class="btn sm ghost" id="n" type="button">やめる</button></div>`;
    cf.querySelector('#y').onclick = () => { cf.innerHTML = ''; doExport(true); }; cf.querySelector('#n').onclick = () => cf.innerHTML = ''; cf.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (typeof JSZip === 'undefined') { toast('ZIPの準備ができていません。ページを再読み込みしてください'); return; }
  const nx = $('next'); nx.disabled = true; nx.textContent = '書き出し中…';
  try {
    const zip = new JSZip(), sp = SPEC[S.mode], over = [];
    for (const sl of slotsAll()) { const cd = sourceFor(sl); if (!cd) continue; const r = convert(cd, sl); let b = await pngUnder(r.canvas, sl); if (b.size > MB) over.push(fname(sl)); zip.file(fname(sl), b); }
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    if (sp.zipLimitMB && out.size > sp.zipLimitMB * MB) toast(`ZIPが${sp.zipLimitMB}MBを超えています（${(out.size / MB).toFixed(1)}MB）`); else if (over.length) toast(`1MBを超える画像があります：${over.join(', ')}`);
    S.done = true; scheduleSave();
    showSavePanel(`${sp.zipName}_${S.mode === 'theme' ? 'set' : S.count[S.mode]}_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.zip`, out, zip.file(/.*/).length);
  } catch (e) { toast('書き出しに失敗しました：' + (e.message || e.code || e)); }
  finally { renderBar(); }
}
// After the ZIP is built, the viewer taps a button to save it: phones only allow
// downloads and the share sheet from a direct tap, so the save is never started from async code.
function showSavePanel(name, blob, n) {
  const cf = $('cf'), file = new File([blob], name, { type: 'application/zip' });
  const share = !dl && typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] });
  cf.innerHTML = `<div class="savebox" role="status"><div><b>ZIPができました</b><span class="hint">${esc(name)}・${n}枚・${(blob.size / MB).toFixed(1)}MB</span></div>
    <div class="row"><button class="btn hi" id="svz" type="button">ZIPを保存</button>${share ? '<button class="btn" id="svs" type="button">共有・保存（スマホ）</button>' : ''}<button class="btn ghost" id="svn" type="button">次のセットを作る</button></div>
    <p class="hint">${share ? 'iPhoneは「共有・保存」→「“ファイル”に保存」を選ぶと、ファイルアプリの好きな場所に保存できます。「ZIPを保存」ではダウンロードフォルダに入ります。' : IS_MOBILE ? '「ZIPを保存」を押すと、ダウンロードフォルダ（iPhoneはファイルアプリの「ダウンロード」）に保存されます。' : '保存先はブラウザのダウンロードフォルダです。'}</p></div>`;
  cf.querySelector('#svz').onclick = () => saveFile(name, blob);
  cf.querySelector('#svn').onclick = () => { clearWork(); S.maxStep = 0; go(0); toast('新しいセットを始めます。種類と個数を選んでください'); };
  if (share) cf.querySelector('#svs').onclick = async () => { try { await navigator.share({ files: [file] }); toast('共有画面で保存先を選んでください'); } catch (e) { if (e.name !== 'AbortError') { toast('共有できませんでした。「ZIPを保存」をお使いください'); } } };
  cf.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (!IS_MOBILE && !dl) saveFile(name, blob); // computers: start the download right away as before
}
let dl = null;
async function saveFile(name, blob) {
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast(`${name} を保存しました`); } catch (e) { toast(e && e.code === 'declined' ? '保存をキャンセルしました' : e && e.code === 'rate_limited' ? '保存の確認が開いています。少し待ってからどうぞ' : 'このページからは保存できませんでした。HTMLファイル版のツールを使うと保存できます'); } return; }
  const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); toast(`${name} を保存しました`);
}

/* ---------- autosave: keep the work on this device so a closed tab can be resumed ---------- */
const STORE = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open('stampkit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode), st = t.objectStore('kv'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => st.put(v, k)), del: k => tx('readwrite', st => st.delete(k)) };
})();
const toPng = (c) => new Promise(r => c.toBlob(r, 'image/png'));
let saveT = null, saveReady = false, lastSaved = 0;
function scheduleSave() { if (!saveReady) return; clearTimeout(saveT); saveT = setTimeout(saveNow, 900); }
async function saveNow() {
  try {
    if (!S.cands.length) { await STORE.del('work'); return; }
    for (const cd of S.cands) {
      // a frame may be moved while we encode: only keep a blob if the image is still the same one
      if (!cd.rawBlob) { const r = cd.raw, bl = await toPng(r); if (cd.raw === r) cd.rawBlob = bl; }
      if (cd.proc && !cd.procBlob) { const r = cd.proc, bl = await toPng(r); if (cd.proc === r) cd.procBlob = bl; }
      if (!cd.proc) cd.procBlob = null;
    }
    if (S.cands.some(c => !c.rawBlob || (c.proc && !c.procBlob))) { scheduleSave(); return; }
    await STORE.set('work', { v: 1, at: Date.now(), uid, mode: S.mode, count: S.count, themeOpt: S.themeOpt, margin: S.margin, stickerFit: S.stickerFit, themeBg: S.themeBg, mirror: S.mirror,
      picked: S.picked, mainId: S.mainId, tabId: S.tabId, themeAssign: S.themeAssign, fileNames: S.fileNames, words: S.words, dupOk: S.dupOk, step: S.step, done: S.done,
      cands: S.cands.map(c => ({ id: c.id, raw: c.rawBlob, proc: c.procBlob, transparent: c.transparent, sheetId: c.sheetId, manual: !!c.manual })) });
    lastSaved = Date.now(); const m = $('saved'); if (m) m.textContent = '自動保存しました';
  } catch (e) { /* storage unavailable (private mode etc.): the tool still works without it */ }
}
async function blobToCanvas(b) { const im = await loadImg(b); const c = mk(im.width, im.height); ctx2(c).drawImage(im, 0, 0); if (im.close) im.close(); return c; }
async function restore(data) {
  const ld = el('<div class="loading" role="status"><div>前回の作業を読み込んでいます…</div></div>'); document.body.appendChild(ld);
  try {
    const cands = [];
    for (const c of data.cands) { const raw = await blobToCanvas(c.raw); const proc = c.proc ? await blobToCanvas(c.proc) : null;
      cands.push({ id: c.id, raw, proc, transparent: c.transparent, sheetId: c.sheetId, manual: !!c.manual, ver: 0, rawBlob: c.raw, procBlob: c.proc, url: thumbURL(proc || raw), rawUrl: proc ? thumbURL(raw) : undefined }); }
    clearWork(); S.byMode = {};
    Object.assign(S, { mode: data.mode, count: data.count, themeOpt: data.themeOpt, margin: data.margin, stickerFit: data.stickerFit, themeBg: data.themeBg, mirror: data.mirror,
      picked: data.picked || [], mainId: data.mainId, tabId: data.tabId, themeAssign: data.themeAssign || {}, fileNames: data.fileNames || {}, words: data.words || {}, dupOk: data.dupOk || {}, cands });
    uid = Math.max(uid, data.uid || 0, ...cands.map(c => c.id)) + 1;
    const st = Math.max(2, Math.min(5, data.step || 2)); S.maxStep = st; toast(`${cands.length}枚の絵を読み込みました`); saveReady = true; go(st);
  } catch (e) { toast('前回の作業を読み込めませんでした'); saveReady = true; }

}
let pendingResume = null;
async function offerResume() {
  let data = null; try { data = await STORE.get('work'); } catch (e) { saveReady = true; return; }
  if (data && data.done) { try { await STORE.del('work'); } catch (e) {} saveReady = true; return; } // finished set: nothing to resume
  if (!data || !data.cands || !data.cands.length) { saveReady = true; return; }
  pendingResume = data; render();
}
function resumeBox() {
  const data = pendingResume, when = new Date(data.at), lbl = `${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}`;
  const box = el(`<div class="resume" role="region" aria-label="前回の作業"><b>前回の作業が残っています</b><span class="hint">${SPEC[data.mode].label}・切り出した絵 ${data.cands.length}枚・${lbl} に保存。新しく画像を取り込むと、前回の作業は上書きされます。</span>
    <div class="row"><button class="btn primary" type="button" id="rs">続きから再開</button><button class="btn ghost" type="button" id="rn">削除して新しく始める</button></div></div>`);
  box.querySelector('#rs').onclick = () => { pendingResume = null; restore(data); };
  box.querySelector('#rn').onclick = async () => { pendingResume = null; try { await STORE.del('work'); } catch (e) {} saveReady = true; toast('前回の作業を削除しました'); render(); };
  return box;
}
// starting new work while an old one is pending means "start fresh"
function startFresh() { if (pendingResume) { pendingResume = null; saveReady = true; } }

/* ---------- sample sheet (labelled "サンプル") ---------- */
function makeSample() {
  const W = 1600, H = 1600, c = mk(W, H), x = ctx2(c); x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  const cols = ['#ffb4c8', '#ffd66b', '#9be3c9', '#a9c4ff', '#ffc69b', '#d5b6ff', '#b8ec8e', '#ff9e9e'];
  const words = ['OK!', 'ありがと', 'おつかれ', '了解', 'えらい', 'ねむい', 'やった', 'ごめん', 'おはよ', 'おやすみ', 'すき', 'まって', 'いいね', 'ファイト', 'おめでと', 'なるほど'];
  for (let i = 0; i < 16; i++) {
    const cx = 200 + (i % 4) * 400, cy = 200 + Math.floor(i / 4) * 400; x.save(); x.translate(cx, cy);
    x.lineWidth = 9; x.strokeStyle = '#2a2430'; x.fillStyle = cols[i % 8];
    x.beginPath(); x.moveTo(-95, -70); x.lineTo(-70, -135); x.lineTo(-30, -95); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(95, -70); x.lineTo(70, -135); x.lineTo(30, -95); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.ellipse(0, 0, 120, 105, 0, 0, Math.PI * 2); x.fill(); x.stroke();
    x.fillStyle = '#2a2430';
    if (i % 8 === 5) { x.lineWidth = 7; x.beginPath(); x.moveTo(-55, -10); x.lineTo(-25, -10); x.moveTo(25, -10); x.lineTo(55, -10); x.stroke(); }
    else { x.beginPath(); x.arc(-40, -10, 13, 0, Math.PI * 2); x.arc(40, -10, 13, 0, Math.PI * 2); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(-44, -15, 4, 0, Math.PI * 2); x.arc(36, -15, 4, 0, Math.PI * 2); x.fill(); }
    x.strokeStyle = '#2a2430'; x.lineWidth = 6; x.beginPath(); if (i % 8 === 7) x.arc(0, 40, 18, Math.PI * 1.15, Math.PI * 1.85); else x.arc(0, 15, 20, Math.PI * .15, Math.PI * .85); x.stroke();
    x.fillStyle = 'rgba(255,110,140,.45)'; x.beginPath(); x.ellipse(-70, 25, 20, 11, 0, 0, Math.PI * 2); x.ellipse(70, 25, 20, 11, 0, 0, Math.PI * 2); x.fill();
    x.font = '900 50px "Zen Kaku Gothic New","Hiragino Sans",sans-serif'; x.textAlign = 'center'; x.lineWidth = 10; x.strokeStyle = '#fff'; x.lineJoin = 'round';
    x.strokeText(words[i], 0, 150); x.fillStyle = '#2a2430'; x.fillText(words[i], 0, 150); x.restore();
  }
  return c;
}

/* ---------- wiring ---------- */
$('back').onclick = () => go(S.step - 1);
$('next').onclick = () => { if (S.step === 5) doExport(false); else { if (S.step === 0) freshIfDone(); go(S.step + 1); } };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('pop').innerHTML = '';
  if (S.step === 1 && S.selBox !== null && (e.key === 'Delete' || e.key === 'Backspace') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { const sh = sheet(S.active); if (sh) { sh.boxes.splice(S.selBox, 1); S.selBox = null; render(); } }
});
if (/ Line\/|FBAN|FBAV|Instagram|Twitter|TikTok|; wv\)/i.test(navigator.userAgent)) $('inapp').hidden = false;
render();
offerResume();
(async () => { try { if (window.claude?.use) dl = await window.claude.use('downloads'); } catch { dl = null; } })();
